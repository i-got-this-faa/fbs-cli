[package]
name = "fbs-cli"
version = "0.0.2"
edition = "2024"

[[bin]]
name = "fbs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
mime_guess = "2.0.5"
quick-xml = { version = "0.41.0", features = ["serialize"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
rpassword = "7.5.4"
rust-s3 = { version = "0.37.2", default-features = false, features = ["sync-rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["formatting"] }
url = "2.5.8"
